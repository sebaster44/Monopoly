[project]
name = "monopoly"
version = "0.1.0"
description = "Simplified multiplayer Monopoly served over WebSocket with JSON-RPC 2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
# Domain errors read better without an "Error" suffix (e.g. NotYourTurn).
ignore = ["N818"]

[tool.mypy]
strict = true
packages = ["app", "tests"]
